<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="t d">
<title id="t">Mutual pursuit and evasion control architecture</title>
<desc id="d">Two robots share pursuit and evasion PPO policies. A rule switches roles based on distance. Upper PPO outputs commands to lower locomotion PPO, then to Go2 joints in Genesis.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111"/></marker></defs>
<rect width="1000" height="480" fill="white"/>
<g fill="white" stroke="#111" stroke-width="2"><rect x="48" y="54" width="220" height="78" rx="4"/><rect x="350" y="40" width="256" height="52" rx="4"/><rect x="350" y="108" width="256" height="52" rx="4"/><rect x="690" y="54" width="254" height="78" rx="4"/><rect x="690" y="198" width="254" height="62" rx="4"/><rect x="690" y="326" width="254" height="62" rx="4"/><rect x="350" y="326" width="256" height="62" rx="4"/></g>
<g font-family="Arial, 'Noto Sans CJK JP', sans-serif" fill="#111" text-anchor="middle"><text x="158" y="85" font-size="20" font-weight="bold">Role switch</text><text x="158" y="110" font-size="15">distance rule</text><text x="478" y="73" font-size="18">Pursuit PPO (12D)</text><text x="478" y="141" font-size="18">Evasion PPO (12D)</text><text x="817" y="84" font-size="19" font-weight="bold">Upper controller</text><text x="817" y="109" font-size="15">forward / yaw command</text><text x="817" y="235" font-size="19" font-weight="bold">Locomotion PPO</text><text x="817" y="363" font-size="19" font-weight="bold">Go2 leg joints</text><text x="478" y="350" font-size="19" font-weight="bold">Genesis</text><text x="478" y="373" font-size="14">position / distance</text><text x="500" y="20" font-size="16">Same policy set used by both robots (A and B)</text></g>
<g fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"><path d="M268 82 H316 V66 H348"/><path d="M316 82 V134 H348"/><path d="M606 66 H688"/><path d="M606 134 H650 V115 H688"/><path d="M817 132 V196"/><path d="M817 260 V324"/><path d="M690 357 H608"/><path d="M350 357 H158 V134"/></g>
